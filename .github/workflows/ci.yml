name: CI

# Corre en cada PR y en cada push a master: lint + build.
# Si algo falla aquí, NO deberías mergear (ni liberar versión).
on:
  pull_request:
  push:
    branches: [master]

# Si subes un commit nuevo mientras corre uno viejo, cancela el viejo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint y build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # pnpm primero: setup-node necesita pnpm instalado para poder cachear.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # next build ya incluye el type-check de TypeScript.
      - name: Build
        run: pnpm build

  # Verifica que la imagen Docker construye en cada PR/push, SIN subirla.
  # Así un Dockerfile roto se detecta antes de crear una versión.
  docker-build:
    name: Docker build (sin push)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
