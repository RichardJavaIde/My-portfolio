name: Release

# Versionado automático con release-please + imagen Docker con ESA versión:
#  1. Tú haces commits con formato Conventional Commits (feat:, fix:, ...).
#  2. En cada push a master, el bot abre/actualiza un PR "chore(master): release X.Y.Z"
#     con el CHANGELOG y el nuevo número de versión en package.json.
#  3. Cuando MERGEAS ese PR, el bot crea el tag vX.Y.Z y el GitHub Release.
#  4. Solo en ese momento, el job "docker" construye la imagen y la sube a GHCR
#     con los tags X.Y.Z y latest.
on:
  push:
    branches: [master]

permissions:
  contents: write       # crear tags y releases
  pull-requests: write  # abrir el PR de release
  issues: write         # etiquetas que usa release-please

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # Se exponen para que el job "docker" sepa si hay versión nueva y cuál es.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resumen de la versión
        if: ${{ steps.release.outputs.release_created }}
        run: echo "Nueva versión publicada ${{ steps.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Imagen Docker
    needs: release-please
    # Solo corre cuando se acaba de crear una versión (al mergear el PR de release).
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # subir la imagen a GitHub Container Registry
    steps:
      # Construimos exactamente el código del tag recién creado.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action arma el nombre de la imagen en minúsculas (GHCR lo exige)
      # y los tags: 0.2.0 y latest.
      - name: Tags de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.release-please.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
