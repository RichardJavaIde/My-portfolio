name: Release

# Versionado automático con release-please:
#  1. Tú haces commits con formato Conventional Commits (feat:, fix:, ...).
#  2. En cada push a main, el bot abre/actualiza un PR "chore(main): release X.Y.Z"
#     con el CHANGELOG y el nuevo número de versión en package.json.
#  3. Cuando MERGEAS ese PR, el bot crea el tag vX.Y.Z y el GitHub Release.
on:
  push:
    branches: [master]

permissions:
  contents: write       # crear tags y releases
  pull-requests: write  # abrir el PR de release
  issues: write         # etiquetas que usa release-please

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resumen de la versión
        if: ${{ steps.release.outputs.release_created }}
        run: echo "Nueva versión publicada ${{ steps.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
